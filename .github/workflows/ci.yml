name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    uses: dinglebear-ai/workflows/.github/workflows/fast-node.yml@64d705af6e164aac58d507df6fb2f6bdc8a4d22d
    with:
      node-version: "24"
      lint-command: npm run lint && npm run format:check
      test-command: npm run test:coverage
      build-command: npm run build:node && npm run smoke:stdio:built

  go:
    uses: dinglebear-ai/workflows/.github/workflows/fast-go.yml@64d705af6e164aac58d507df6fb2f6bdc8a4d22d
    with:
      go-version: "1.25.x"

  sftp-integration:
    name: Real OpenSSH SFTP integration
    runs-on: ci-pool-typescript
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Install OpenSSH test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check:launcher
      - name: Exercise the built helper through OpenSSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" "$RUNNER_TEMP/connexin-sshd"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/connexin-sshd/id"
          cat "$RUNNER_TEMP/connexin-sshd/id.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 22229
          printf 'Host connexin-ci\n  HostName 127.0.0.1\n  Port 22229\n  User %s\n  IdentityFile %s/connexin-sshd/id\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' \
            "$(id -un)" "$RUNNER_TEMP" > "$RUNNER_TEMP/connexin-sshd/config"
          npm run test:sftp-integration -- \
            "$PWD/dist/bin/connexin-sftp" \
            "$RUNNER_TEMP/connexin-sshd/config" \
            connexin-ci

  contract:
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@64d705af6e164aac58d507df6fb2f6bdc8a4d22d
    with:
      profile: node
      implementation-ref: 64d705af6e164aac58d507df6fb2f6bdc8a4d22d

  workflow-policy:
    uses: dinglebear-ai/workflows/.github/workflows/fleet-policy.yml@64d705af6e164aac58d507df6fb2f6bdc8a4d22d

  build:
    name: Build
    if: always()
    needs: [node, go, sftp-integration, contract, workflow-policy]
    runs-on: ci-pool-ops
    timeout-minutes: 5
    steps:
      - name: Require every CI lane
        env:
          NODE: ${{ needs.node.result }}
          GO: ${{ needs.go.result }}
          SFTP: ${{ needs.sftp-integration.result }}
          CONTRACT: ${{ needs.contract.result }}
          WORKFLOW_POLICY: ${{ needs.workflow-policy.result }}
        run: |
          test "$NODE" = success
          test "$GO" = success
          test "$SFTP" = success
          test "$CONTRACT" = success
          test "$WORKFLOW_POLICY" = success
