name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install OpenSSH test runtime
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Test SFTP helper
        run: go test ./... && go vet ./...

      - name: Build
        run: npm run build

      - name: Real OpenSSH SFTP integration
        run: |
          mkdir -p "$HOME/.ssh" /tmp/connexin-sshd
          ssh-keygen -q -t ed25519 -N '' -f /tmp/connexin-sshd/id
          cat /tmp/connexin-sshd/id.pub >> "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 22229
          printf 'Host connexin-ci\n  HostName 127.0.0.1\n  Port 22229\n  User %s\n  IdentityFile /tmp/connexin-sshd/id\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' "$USER" > /tmp/connexin-sshd/config
          npm run test:sftp-integration -- "$PWD/dist/bin/connexin-sftp" /tmp/connexin-sshd/config connexin-ci

      - name: Lint
        run: npm run lint

      # Catch launcher/packaging breakage in PR CI rather than at release time,
      # when the npm publish job is the first thing to exercise it.
      - name: Check npm launcher and package contents
        run: npm run check:launcher

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Smoke stdio build
        timeout-minutes: 2
        run: npm run smoke:stdio:built
