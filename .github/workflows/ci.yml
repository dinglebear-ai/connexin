name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install OpenSSH test runtime
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Install dependencies
        run: npm ci

      - name: Test SFTP helper
        run: go test ./... && go vet ./...

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Smoke stdio build
        timeout-minutes: 2
        run: npm run smoke:stdio:built
