name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test "$version" != "$TAG"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build-helper:
    name: Build SFTP helper (${{ matrix.goos }}/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            asset: connexin-sftp-linux-x86_64.tar.gz
            binary: connexin-sftp
          - goos: darwin
            asset: connexin-sftp-darwin-x86_64.tar.gz
            binary: connexin-sftp
          - goos: windows
            asset: connexin-sftp-windows-x86_64.tar.gz
            binary: connexin-sftp.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build exact release asset
        env:
          GOOS: ${{ matrix.goos }}
          ASSET: ${{ matrix.asset }}
          BINARY: ${{ matrix.binary }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p out artifacts
          GOARCH=amd64 go build -trimpath -ldflags "-s -w" \
            -o "out/$BINARY" ./cmd/connexin-sftp
          tar -czf "artifacts/$ASSET" -C out "$BINARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helper-${{ matrix.goos }}-amd64
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: build-helper
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: dinglebear-ai/workflows/.github/workflows/github-release.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0
    with:
      release-tag: ${{ github.event.release.tag_name }}
      artifact-pattern: helper-*

  npm:
    needs: [metadata, github-release]
    permissions:
      contents: read
      id-token: write
    uses: dinglebear-ai/workflows/.github/workflows/npm-trusted-publish.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      expected-version: ${{ needs.metadata.outputs.version }}
      node-version: "24"
      verify-command: >-
        npm run build:node &&
        npm run lint &&
        npm run format:check &&
        npm run test:coverage &&
        npm run check:launcher
